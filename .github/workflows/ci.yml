# CORPUS continuous integration (CLAUDE.md §42).
#
#   install → lint → typecheck → unit → integration → security → build → deploy check
#
# Build and test jobs need no secrets and run on every push and pull request.
# Deployment is a separate job, gated on those passing AND on the presence of
# Cloudflare credentials, so a fork or a secret-less run can never deploy.

name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  NODE_VERSION: '20'

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Secret scan
        run: npm run secrets:check

      - name: Dashboard/API contract check
        run: npm run check:contract

      - name: Lint
        run: npm run lint

      - name: Typecheck (API and packages)
        run: npm run typecheck

      - name: Typecheck (dashboard)
        run: npm run typecheck --workspace @corpus/web

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Security tests
        run: npm run test:security

      - name: End-to-end tests
        run: npm run test:e2e

      - name: RBAC migration is in sync with code
        run: |
          npx tsx scripts/generate-rbac-migration.ts
          git diff --exit-code -- migrations/0006_rbac_reference.sql

      - name: Build Worker (dry run)
        working-directory: apps/api
        run: npx wrangler deploy --dry-run --outdir dist --config wrangler.toml

      - name: Build dashboard
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: https://example.invalid
        run: npx next build

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    # Only from the default branch, and only when credentials exist.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Check deployment credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials are not configured; skipping deployment."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply D1 migrations
        if: steps.creds.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply corpus --remote --env production --config apps/api/wrangler.toml

      - name: Deploy Worker
        if: steps.creds.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production --config apps/api/wrangler.toml

      - name: Build dashboard
        if: steps.creds.outputs.configured == 'true'
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
        run: npx next build

      - name: Deploy dashboard to Cloudflare Pages
        if: steps.creds.outputs.configured == 'true' && vars.CLOUDFLARE_PAGES_PROJECT != ''
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx @cloudflare/next-on-pages@1
          npx wrangler pages deploy .vercel/output/static --project-name "${{ vars.CLOUDFLARE_PAGES_PROJECT }}"

      - name: Production smoke test
        if: steps.creds.outputs.configured == 'true' && vars.PUBLIC_API_BASE_URL != ''
        run: |
          set -e
          BASE="${{ vars.PUBLIC_API_BASE_URL }}"
          echo "GET $BASE/health"
          curl -fsS "$BASE/health" | head -c 600; echo
          echo "GET $BASE/public/jobs"
          curl -fsS "$BASE/public/jobs?limit=1" | head -c 300; echo
          echo "POST $BASE/telegram/internal without secret must be 401"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$BASE/telegram/internal" \
            -H 'content-type: application/json' -d '{"update_id":1}')
          test "$CODE" = "401"
